name: Slack Deploy Notify

# Notifies the CONSUMER deployments Slack channel on PR open AND merge (matches Consumer-Web's
# two-message pattern). Payload built with jq --arg (safe escaping). APP_LABEL distinguishes this
# app in a shared channel (web vs mobile vs desktop etc.).
#
# ONE WEBHOOK, not two. The sibling repos split main → their own deployments channel and dev
# branches → the shared #dev-deployments channel. This repo reports everything into consumer
# deployments (Jordan, 2026-07-30), so both secrets would have held the same URL — and two secrets
# that must stay identical are not a feature, they are a way for one of them to quietly drift and
# send half the notifications somewhere nobody is reading. Splitting channels later is a one-line
# change, and a deliberate one.

on:
  pull_request:
    types: [opened, closed]
    branches: [main, develop, development]

jobs:
  notify-opened:
    # 🔴 SKIPPED FOR DEPENDABOT, BECAUSE IT CANNOT WORK — NOT BECAUSE IT IS NOISY.
    #
    # A workflow run triggered by Dependabot does NOT receive repository secrets. GitHub gives it a
    # restricted token and a SEPARATE Dependabot secrets store, so `secrets.*SLACK*` resolves to
    # the empty string and the action dies with
    #
    #     SlackError: Missing input! Either a method or webhook is required to take action.
    #
    # ⚠️ NOT HYPOTHETICAL, AND NOT NEW. Measured across the fleet on 2026-08-31 — this repo's
    # siblings have been failing this way for a while and nobody connected the alerts to a cause:
    #
    #     Partner-Web     5 dependabot runs, 5 FAILED
    #     Payments-Api   12 runs,            8 FAILED
    #     eShop-Web       4 runs,            4 FAILED
    #     Admin-Web       4 notify runs,     4 FAILED
    #
    # while every NON-Dependabot branch on the same day succeeded, including branches whose names
    # begin with "dependabot" but were authored by a human. The discriminator is the ACTOR, which
    # is why this tests github.actor and not the branch name.
    #
    # ⚠️ Scoped to `opened` on purpose. The merge job below is NOT skipped: on `closed`,
    # github.actor is the HUMAN who merged, so secrets are present and the notification works —
    # and a Dependabot merge is a real deploy that should still be announced.
    #
    # ⚠️ And deliberately NOT a "skip if the webhook is empty" guard. That reads as the more
    # general fix and is worse: it would also swallow a rotated or deleted secret and switch
    # deploy notifications off SILENTLY. Dependabot is a known, permanent, expected condition and
    # is named as such. Every other cause of an empty webhook must stay loud.
    if: github.event.action == 'opened' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Build payload
        id: data
        env:
          APP_LABEL: "🧩 Browser Extension"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          BODY_SNIPPET=$(printf '%s' "$PR_BODY" | head -5 | tr '\n' ' ' | cut -c1-300)
          payload=$(jq -nc \
            --arg applabel "$APP_LABEL" --arg title "$PR_TITLE" --arg body "$BODY_SNIPPET" \
            --arg url "$PR_URL" --arg num "$PR_NUM" --arg head "$HEAD_REF" --arg base "$BASE_REF" --arg author "$AUTHOR" \
            '{
              text: (":arrow_heading_up: " + $applabel + " — New PR"),
              attachments: [ { color: "#2196F3", blocks: [
                { type: "section", text: { type: "mrkdwn", text: ("*<" + $url + "|#" + $num + ": " + $title + ">*") } },
                { type: "section", text: { type: "mrkdwn", text: (":speech_balloon: " + $body) } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: (":twisted_rightwards_arrows: *Branch*\n`" + $head + "` → `" + $base + "`") },
                  { type: "mrkdwn", text: (":bust_in_silhouette: *Author*\n" + $author) },
                  { type: "mrkdwn", text: (":link: *PR*\n<" + $url + "|View PR →>") }
                ] }
              ] } ]
            }')
          { echo "payload<<JSONEOF"; echo "$payload"; echo "JSONEOF"; } >> "$GITHUB_OUTPUT"

      # `errors: true` so a rejected payload FAILS the job. Silence is the failure mode that matters
      # for a notifier: nobody notices a message that was never sent.
      - name: Post — consumer deployments
        uses: slackapi/slack-github-action@v2.1.0
        with:
          errors: true
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.data.outputs.payload }}

  notify:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Build payload
        id: data
        env:
          APP_LABEL: "🧩 Browser Extension"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
        run: |
          # NOT "production". Unlike every other FTNSS repo, a merge to main here does NOT deploy anything:
          # this ships through the Chrome Web Store, so main is only a candidate until a release is tagged
          # and submitted, and store review is days of calendar time later. The sibling repos' wording
          # ("deploying to production!") would be a false statement in the channel on every single merge —
          # and a channel that routinely says something untrue is one people stop reading.
          if [ "$BASE_REF" = "main" ]; then ENVN="main — ships at the next store release"; else ENVN="$BASE_REF"; fi
          SHA_SHORT=$(printf '%s' "$SHA" | cut -c1-7)
          SHA_URL="https://github.com/$REPO/commit/$SHA"
          BODY_SNIPPET=$(printf '%s' "$PR_BODY" | head -5 | tr '\n' ' ' | cut -c1-300)
          payload=$(jq -nc \
            --arg applabel "$APP_LABEL" --arg envn "$ENVN" --arg title "$PR_TITLE" --arg body "$BODY_SNIPPET" \
            --arg url "$PR_URL" --arg num "$PR_NUM" --arg head "$HEAD_REF" --arg base "$BASE_REF" \
            --arg mergedby "$MERGED_BY" --arg shashort "$SHA_SHORT" --arg shaurl "$SHA_URL" \
            '{
              text: (":merged: " + $applabel + " — PR Merged → " + $envn),
              attachments: [ { color: "#FF4D1C", blocks: [
                { type: "section", text: { type: "mrkdwn", text: ("*<" + $url + "|#" + $num + ": " + $title + ">*") } },
                { type: "section", text: { type: "mrkdwn", text: (":speech_balloon: " + $body) } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: (":seedling: *Branch*\n`" + $head + "` → `" + $base + "`") },
                  { type: "mrkdwn", text: (":memo: *Commit*\n<" + $shaurl + "|" + $shashort + ">") },
                  { type: "mrkdwn", text: (":bust_in_silhouette: *Merged by*\n" + $mergedby) },
                  { type: "mrkdwn", text: (":link: *PR*\n<" + $url + "|View PR →>") }
                ] }
              ] } ]
            }')
          { echo "payload<<JSONEOF"; echo "$payload"; echo "JSONEOF"; } >> "$GITHUB_OUTPUT"

      # `errors: true` so a rejected payload FAILS the job. Silence is the failure mode that matters
      # for a notifier: nobody notices a message that was never sent.
      - name: Post — consumer deployments
        uses: slackapi/slack-github-action@v2.1.0
        with:
          errors: true
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.data.outputs.payload }}
