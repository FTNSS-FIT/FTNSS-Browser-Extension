# Gemini Code Assist — the automated reviewer for this repo as of 2026-08-05.
#
# Replaces Greptile, which was retired on cost (~$100/day at a 50% discount, against ~$22/month
# here). The `.greptile/` directory is deleted in the same commit; the rules it carried live in
# styleguide.md, which is the file Gemini is documented to read.
#
# WHAT IS NOT KNOWN, and is not assumed here: whether Gemini reads `AGENTS.md`. Greptile did, and
# that conclusion does NOT carry across vendors. So `styleguide.md` restates the high-value rules
# inline rather than referencing AGENTS.md and hoping. A rule that may or may not have loaded is
# worse than no rule, because a generic review still looks like a review.

have_fun: false

code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  # This repo's PRs are deliberately small and cohesive. A cap that silently truncates would
  # reproduce the failure we already had once with Codex: a partial review that looks complete.
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    # AUTO-REVIEW ON OPEN IS OFF, DELIBERATELY, AND THIS IS THE EXPENSIVE LEVER.
    #
    # Measured 2026-08-05 by Consumer-Web: the org-wide daily allowance is ~3-5 reviews, not the
    # ~20 our notes claimed — off by roughly 5x. It is SHARED across every FTNSS repo, so an
    # attempt spent here is one Admin-Web or Consumer-Mobile cannot make. Three reviews at 13:07,
    # 13:09 and 13:15 exhausted the day by 14:36.
    #
    # `code_review: true` spends one of those on EVERY pull_request_opened event — including
    # drafts and docs-only PRs nobody wants reviewed. Our workflow opens every PR as a draft, so
    # leaving this on would spend the org's scarcest resource on the least valuable moment: before
    # the work is finished.
    #
    # THE TRAP THAT MAKES THIS NECESSARY RATHER THAN MERELY TIDY: `ready_for_review` is a
    # DIFFERENT EVENT AND GEMINI IGNORES IT. Marking a draft ready triggers nothing. So the
    # draft-first loop in CLAUDE.md — "open as draft -> mark ready ONCE -> one review" — has no
    # step that ever asks for a review. Consumer-Web #939 sat unreviewed after being marked ready
    # while the quota was demonstrably live.
    #
    # So the trigger here is always explicit: comment `/gemini review` when the PR is actually
    # ready. One deliberate attempt, at the moment it is worth spending.
    code_review: false
